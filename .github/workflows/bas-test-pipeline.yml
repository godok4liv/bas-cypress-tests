name: Cypress Bas Regression Tests
on: [push, pull_request]
  
  

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          node-version: 16
          build: npm run build
          start: npm start